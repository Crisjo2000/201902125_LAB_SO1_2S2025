apiVersion: v1
kind: Service
metadata:
  name: go-grpc-client-service
  namespace: sopes1-proyecto3
spec:
  selector:
    app: go-grpc-client
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-grpc-client
  namespace: sopes1-proyecto3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-grpc-client
  template:
    metadata:
      labels:
        app: go-grpc-client
    spec:
      containers:
      - name: go-grpc-client
        image: 34.70.157.232:5000/go-grpc-client:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: KAFKA_WRITER_ADDR
          value: "go-kafka-writer-service:50051"
        - name: RABBITMQ_WRITER_ADDR
          value: "go-rabbitmq-writer-service:50052"