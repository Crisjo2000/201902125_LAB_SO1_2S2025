apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proyecto3-ingress
  namespace: sopes1-proyecto3
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /tweet
        pathType: Prefix
        backend:
          service:
            name: rust-api-service
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: rust-api-service
            port:
              number: 8000