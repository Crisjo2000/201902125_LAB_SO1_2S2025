apiVersion: v1
kind: Service
metadata:
  name: go-kafka-writer-service
  namespace: sopes1-proyecto3
spec:
  selector:
    app: go-kafka-writer
  ports:
  - port: 50051
    targetPort: 50051
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-kafka-writer
  namespace: sopes1-proyecto3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-kafka-writer
  template:
    metadata:
      labels:
        app: go-kafka-writer
    spec:
      containers:
      - name: go-kafka-writer
        image: 34.70.157.232:5000/go-kafka-writer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
        env:
        - name: GRPC_PORT
          value: "50051"
        - name: KAFKA_BROKER
          value: "kafka-service:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: go-rabbitmq-writer-service
  namespace: sopes1-proyecto3
spec:
  selector:
    app: go-rabbitmq-writer
  ports:
  - port: 50052
    targetPort: 50052
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-rabbitmq-writer
  namespace: sopes1-proyecto3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-rabbitmq-writer
  template:
    metadata:
      labels:
        app: go-rabbitmq-writer
    spec:
      containers:
      - name: go-rabbitmq-writer
        image: 34.70.157.232:5000/go-rabbitmq-writer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 50052
        env:
        - name: GRPC_PORT
          value: "50052"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq-service:5672/"