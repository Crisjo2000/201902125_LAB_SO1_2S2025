apiVersion: v1
kind: Service
metadata:
  name: valkey-service
  namespace: sopes1-proyecto3
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: sopes1-proyecto3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:7.2-alpine
        ports:
        - containerPort: 6379
        command: ["valkey-server"]
        args: ["--appendonly", "yes"]
        volumeMounts:
        - name: valkey-storage
          mountPath: /data
      volumes:
      - name: valkey-storage
        emptyDir: {}